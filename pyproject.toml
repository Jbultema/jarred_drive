[tool.poetry]
name = "jarred-drive"
version = "0.1.0"
description = "DIY foil-assist flight recorder, safety monitor, and session analytics dashboard."
authors = ["Jbultema <Jbultema@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "jarred_drive", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<3.0"
pandas = ">=2.2,<3.0"
plotly = ">=5.24,<7.0"
pyyaml = ">=6.0,<7.0"
streamlit = ">=1.38,<2.0"
typer = ">=0.12,<1.0"

[tool.poetry.group.dev.dependencies]
black = ">=24.10,<26.0"
mypy = ">=1.13,<2.0"
platformio = ">=6.1,<7.0"
pytest = ">=8.3,<9.0"
ruff = ">=0.8,<1.0"
types-pyyaml = ">=6.0,<7.0"

[tool.poetry.scripts]
jarred-drive = "jarred_drive.cli:app"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
